<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Not Found</title>
<link rel="stylesheet" href="style.css">
<style>
.not-found{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.not-found__code{margin:0 0 20px;font-size:clamp(80px,15vw,180px);line-height:.9;font-weight:200;letter-spacing:-.08em}
.not-found__text{margin:0;color:var(--muted);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
</style>
</head>
<body>
<main class="not-found"><p class="not-found__code">404</p><p class="not-found__text">Not Found</p></main>
</body>
</html>
